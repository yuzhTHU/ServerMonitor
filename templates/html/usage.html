<style>
    .usage-host-menu {
        width: min(24rem, calc(100vw - 2rem));
        max-height: 22rem;
        padding: 0;
        overflow: hidden;
        border: 1px solid #dfe6ee;
        border-radius: .8rem;
        box-shadow: 0 12px 30px rgba(31, 45, 61, .14);
    }
    .usage-host-actions {
        display: flex;
        justify-content: space-between;
        padding: .7rem .85rem;
        background: #f7f9fc;
        border-bottom: 1px solid #e7ecf2;
    }
    .usage-host-list { max-height: 17rem; padding: .45rem; overflow-y: auto; }
    .usage-host-option {
        display: flex;
        align-items: center;
        gap: .65rem;
        padding: .52rem .65rem;
        border-radius: .5rem;
        cursor: pointer;
    }
    .usage-host-option:hover { background: #eef5ff; }
    .usage-host-option input { margin: 0; }
    .usage-stat-card { margin: 1rem 0 0; overflow: hidden; }
    .usage-stat-card .card-title { margin: 0; }
    .usage-stat-subtitle { color: #8795a5; font-size: .82rem; }
    .usage-stat-body { height: 180px; transition: height .25s ease; }
    .usage-stat-body.is-active { height: 480px; }
    .usage-stat-chart { width: 100%; height: 100%; }
    .usage-query-summary {
        display: none;
        margin-top: .85rem;
        color: #718096;
        font-size: .86rem;
    }
    .usage-query-summary.is-visible { display: block; }
    .usage-progress {
        display: none;
        align-items: center;
        gap: .75rem;
        margin-top: 1rem;
        padding: .7rem .9rem;
        border: 1px solid rgba(13, 110, 253, .14);
        border-radius: .75rem;
        background: rgba(13, 110, 253, .045);
    }
    .usage-progress.is-visible { display: flex; }
    .usage-progress-track {
        position: relative;
        flex: 1;
        min-width: 0;
        height: .55rem;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(13, 110, 253, .12);
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, .06);
    }
    .usage-progress-bar {
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #4f8cff, #7158e2, #2ed8b6);
        box-shadow: 0 0 10px rgba(79, 140, 255, .35);
        transition: width .25s ease;
    }
    .usage-progress.is-complete .usage-progress-bar {
        background: linear-gradient(90deg, #20c997, #2ed8b6);
    }
    .usage-progress.is-error .usage-progress-bar { background: #dc3545; }
    .usage-progress-label {
        min-width: 8rem;
        color: #52606d;
        font-size: .82rem;
        font-weight: 600;
        text-align: right;
        white-space: nowrap;
    }
</style>

<div class="mt-3">
    <div class="row align-items-end g-3">
        <div class="col-lg-4 col-md-5">
            <label class="form-label" for="usage-host-button">服务器</label>
            <div class="dropdown">
                <button id="usage-host-button" class="btn btn-light border dropdown-toggle w-100 text-start"
                        type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
                    请选择服务器
                </button>
                <div class="dropdown-menu usage-host-menu">
                    <div class="usage-host-actions">
                        <button id="usage-select-all" type="button" class="btn btn-sm btn-link text-decoration-none">全选</button>
                        <button id="usage-clear-all" type="button" class="btn btn-sm btn-link text-decoration-none text-secondary">清除选择</button>
                    </div>
                    <div id="usage-host-list" class="usage-host-list"></div>
                </div>
            </div>
        </div>
        <div class="col-lg-2 col-md-3">
            <label class="form-label" for="usage-start-date">起始日期</label>
            <input type="date" id="usage-start-date" class="form-control">
        </div>
        <div class="col-lg-2 col-md-3">
            <label class="form-label" for="usage-end-date">结束日期</label>
            <input type="date" id="usage-end-date" class="form-control">
        </div>
        <div class="col-lg-2 col-md-3">
            <button id="fetch-usage-stats" type="button" class="btn btn-primary w-100">生成统计图表</button>
        </div>
    </div>
    <div id="usage-progress" class="usage-progress" role="progressbar"
         aria-label="用量统计处理进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="usage-progress-track">
            <div id="usage-progress-bar" class="usage-progress-bar"></div>
        </div>
        <span id="usage-progress-label" class="usage-progress-label">准备统计 · 0%</span>
    </div>
    <div id="usage-query-summary" class="usage-query-summary"></div>

    <div id="usage-cards">
        <div class="card usage-stat-card">
            <div class="card-header card-header-layout">
                <div>
                    <h5 class="card-title">CPU 用量</h5>
                    <span class="usage-stat-subtitle">累计用量与并发峰值</span>
                </div>
            </div>
            <div id="usage-cpu-body" class="card-body usage-stat-body">
                <div id="usage-cpu-chart" class="usage-stat-chart"></div>
            </div>
        </div>
        <div class="card usage-stat-card">
            <div class="card-header card-header-layout">
                <div>
                    <h5 class="card-title">内存用量</h5>
                    <span class="usage-stat-subtitle">累计用量与并发峰值</span>
                </div>
            </div>
            <div id="usage-memory-body" class="card-body usage-stat-body">
                <div id="usage-memory-chart" class="usage-stat-chart"></div>
            </div>
        </div>
        <div class="card usage-stat-card">
            <div class="card-header card-header-layout">
                <div>
                    <h5 class="card-title">GPU 显存用量</h5>
                    <span class="usage-stat-subtitle">累计用量与并发峰值</span>
                </div>
            </div>
            <div id="usage-gpu-body" class="card-body usage-stat-body">
                <div id="usage-gpu-chart" class="usage-stat-chart"></div>
            </div>
        </div>
    </div>
</div>
